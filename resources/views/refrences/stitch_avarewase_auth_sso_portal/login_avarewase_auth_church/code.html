<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-margin-mobile">
<div class="w-full max-w-[440px]">
<!-- Authentication Card -->
<main class="bg-surface rounded-lg border border-border-warm warm-shadow overflow-hidden relative">
<!-- Premium Accent Top Border -->
<div class="h-1 w-full bg-[#B8860B] absolute top-0 left-0"></div>
<div class="p-stack-lg flex flex-col items-center">
<!-- Branding -->
<div class="mb-stack-md flex flex-col items-center">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-stack-sm text-on-primary">
<span aria-hidden="true" class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary-container text-center">Avarewase</h1>
<p class="font-body-sm text-body-sm text-text-muted mt-1 text-center">Sign in to your account</p>
</div>
<!-- Requesting Access Banner -->
<div class="w-full bg-[#D4A843]/15 rounded py-2 px-3 mb-stack-md flex items-center justify-center gap-2 border border-[#D4A843]/30">
<span aria-hidden="true" class="material-symbols-outlined text-[#B8860B] text-[18px]">vpn_key</span>
<span class="font-label-sm text-label-sm text-[#715000]">Acme CRM is requesting access</span>
</div>
<!-- Form -->
<form action="#" class="w-full space-y-stack-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-text-main mb-1" for="email">Email</label>
<input class="block w-full rounded border-border-warm bg-surface px-3 py-2 text-text-main focus:border-primary-container focus:ring focus:ring-primary-container/20 focus:outline-none transition-colors font-body-sm text-body-sm" id="email" name="email" placeholder="user@institution.edu" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-text-main mb-1" for="password">Password</label>
<div class="relative">
<input class="block w-full rounded border-border-warm bg-surface px-3 py-2 pr-10 text-text-main focus:border-primary-container focus:ring focus:ring-primary-container/20 focus:outline-none transition-colors font-body-sm text-body-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 px-3 flex items-center text-text-muted hover:text-primary-container focus:outline-none" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-border-warm text-[#B8860B] focus:ring-[#B8860B] focus:ring-offset-surface bg-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-text-main" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-text-muted hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded bg-primary-container font-label-md text-label-md text-on-primary hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors shadow-sm" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="w-full mt-stack-md flex items-center text-center">
<hr class="w-full border-t border-border-warm"/>
<span class="px-2 font-label-sm text-label-sm text-text-muted bg-surface">Or</span>
<hr class="w-full border-t border-border-warm"/>
</div>
<!-- SSO Options -->
<div class="w-full mt-stack-md space-y-3">
<button class="w-full flex items-center justify-center gap-2 py-2 px-4 border border-border-warm rounded bg-surface-container-low font-label-md text-label-md text-text-main hover:bg-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">business</span>
                        Continue with Institution
                    </button>
</div>
</div>
</main>
<!-- Footer -->
<p class="text-center font-label-sm text-label-sm text-text-muted mt-stack-md">
            Powered by Avarewase Auth
        </p>
</div>
</body></html>
