services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: avarewase-auth:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:6500:9000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/public/build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - avarewase
      - phpmyadmin-hub

networks:
  avarewase:
    driver: bridge
  phpmyadmin-hub:
    name: phpmyadmin-hub_phpmyadmin-hub
    external: true
