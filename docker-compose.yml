services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME}
    image: avarewase-auth:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:6500:9000"
    volumes:
      # Source is read-only so a compromised container cannot rewrite the
      # application code; only the paths Laravel legitimately writes to are
      # mounted read-write on top. These host dirs must exist before `up`
      # (mkdir -p storage bootstrap/cache public/build) or Docker creates
      # them root-owned.
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./public/build:/var/www/html/public/build
      - /var/www/html/vendor
      - /var/www/html/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - avarewase
      - phpmyadmin-hub

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - avarewase

networks:
  avarewase:
    driver: bridge
  phpmyadmin-hub:
    name: phpmyadmin-hub_phpmyadmin-hub
    external: true

volumes:
  redis-data:
